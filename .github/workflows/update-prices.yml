name: Update market data

on:
  workflow_dispatch:
  schedule:
    # UTC candidates; schedule_gate checks Europe/Lisbon local time.
    - cron: '45 15,16 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check Lisbon local time
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_time=$(TZ=Europe/Lisbon date +%H:%M)
          echo "Lisbon time: $local_time"
          if [[ "$local_time" > "16:44" && "$local_time" < "17:15" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  quotes:
    needs: schedule_gate
    if: ${{ needs.schedule_gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_prices.py
      - uses: actions/upload-artifact@v4
        with:
          name: quotes
          path: data/prices.json
          retention-days: 1

  session:
    needs: schedule_gate
    if: ${{ needs.schedule_gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_session.py
      - uses: actions/upload-artifact@v4
        with:
          name: session
          path: data/session.json
          retention-days: 1

  technical:
    needs: schedule_gate
    if: ${{ needs.schedule_gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_technical.py
      - uses: actions/upload-artifact@v4
        with:
          name: technical
          path: data/technical.json
          retention-days: 1

  publish:
    needs: [quotes, session, technical]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: data
          merge-multiple: true
      - name: Commit all refreshed market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/session.json data/technical.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update market data"
          git push
