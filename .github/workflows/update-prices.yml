name: Update market data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions supports timezone-aware schedules.\n    - cron: '45 16 * * 1-5'\n      timezone: 'Europe/Lisbon'

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_prices.py
      - uses: actions/upload-artifact@v4
        with:
          name: quotes
          path: data/prices.json
          retention-days: 1

  session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_session.py
      - uses: actions/upload-artifact@v4
        with:
          name: session
          path: data/session.json
          retention-days: 1

  technical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_technical.py
      - uses: actions/upload-artifact@v4
        with:
          name: technical
          path: data/technical.json
          retention-days: 1

  publish:
    needs: [quotes, session, technical]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: data
          merge-multiple: true
      - name: Commit all refreshed market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/session.json data/technical.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update market data"
          git push
