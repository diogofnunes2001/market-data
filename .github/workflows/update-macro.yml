name: Update official rates and bonds

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_macro.py'
      - 'scripts/macro_common.py'
      - 'scripts/validate_macro.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update-macro.yml'
  workflow_dispatch:
  schedule:
    # UTC candidates for 16:35 Europe/Lisbon (DST-aware gate below).
    - cron: '35 15,16 * * 1-5'

permissions:
  contents: write

# Same group as the existing quote workflow: serialize all data commits.
concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check Lisbon local time
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_time=$(TZ=Europe/Lisbon date +%H:%M)
          echo "Lisbon time: $local_time"
          if [[ "$local_time" > "16:29" && "$local_time" < "16:50" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: schedule_gate
    if: ${{ needs.schedule_gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test parsers, dates and failure isolation
        run: python -m unittest discover -s tests -v
      - name: Collect official observed data
        run: python scripts/fetch_macro.py
      - name: Validate JSON contracts
        run: python scripts/validate_macro.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-rates-and-bonds
          path: |
            data/interest_rates.json
            data/euribor.json
            data/sovereign_bonds.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest data and per-run history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interest_rates.json data/euribor.json data/sovereign_bonds.json data/history/
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update official rates and bonds"
          # Rebase over a concurrent user edit; never force-push or overwrite it.
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report provider health
        run: python scripts/validate_macro.py --health
